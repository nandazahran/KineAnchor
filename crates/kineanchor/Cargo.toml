[package]
name = "kineanchor"
description = "Motion sickness overlay for Linux (Wayland layer-shell, X11) and Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kineanchor-core = { path = "../kineanchor-core" }
smithay-client-toolkit = { version = "0.21.1", default-features = false }
wayland-client = "0.31.15"
eframe = { version = "0.31.1", features = ["wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
