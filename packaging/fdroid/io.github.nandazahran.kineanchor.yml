Categories:
  - System
  - Connectivity
License: GPL-3.0-or-later
AuthorName: Nanda Zahran
SourceCode: https://github.com/nandazahran/KineAnchor
IssueTracker: https://github.com/nandazahran/KineAnchor/issues
Changelog: https://github.com/nandazahran/KineAnchor/releases

AutoName: KineAnchor
RepoType: git
Repo: https://github.com/nandazahran/KineAnchor.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y build-essential curl
    init:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.85.0 --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - $$HOME/.cargo/bin/cargo install cargo-ndk --version 3.5.4 --locked
    prebuild:
      - export PATH="$$HOME/.cargo/bin:$$PATH"
      # Run from the repository root, before Gradle enters android/.
      - cd ..
      - cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/app/src/main/jniLibs build --release -p kineanchor-android-ffi
    gradle:
      - yes
    ndk: r27c

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 1
