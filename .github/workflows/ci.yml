name: CI

on:
  push:
    # Docs-only changes cannot break the build; skip the matrix entirely.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK r27c
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package no longer exists upstream.
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build JNI libraries for all three ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: >-
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64
          -o android/app/src/main/jniLibs
          build --release -p kineanchor-android-ffi
      - name: Gradle unit tests and APKs
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Verify the APK carries all three ABIs
        run: |
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libkineanchor_android_ffi.so" \
              || { echo "missing $abi native library in $apk"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kineanchor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
