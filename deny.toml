# Dependency license gate. GPL-3.0-or-later app: GPLv3-compatible licenses only.
# GPL-2.0-only, LGPL-2.1-only and AGPL are intentionally absent.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",           # clipboard-win, error-code (arboard/egui-winit clipboard chain)
    "OFL-1.1",           # epaint_default_fonts (Ubuntu UI font bundled with egui)
    "Ubuntu-font-1.0",   # Ubuntu Font Licence v1.0, same epaint_default_fonts
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
